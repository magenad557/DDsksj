name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path "$env:ProgramFiles\Tailscale" "tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Display RDP Credentials
        run: |
          Write-Host "`n=========================================="
          Write-Host "    RDP CONNECTION DETAILS"
          Write-Host "=========================================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Username   : $env:RDP_USER"
          # عرض كلمة المرور مع تعطيل الإخفاء
          Write-Host "::add-mask::$env:RDP_PASSWORD"
          Write-Host "Password   : $env:RDP_PASSWORD"
          Write-Host "=========================================="
          Write-Host "`nTo connect:"
          Write-Host "1. Open Remote Desktop Connection (mstsc)"
          Write-Host "2. Computer: $env:TAILSCALE_IP"
          Write-Host "3. Username: $env:RDP_USER"
          Write-Host "4. Password: $env:RDP_PASSWORD"
          Write-Host "==========================================`n"

      - name: Save Credentials as Artifact
        run: |
          $credFile = Join-Path $env:TEMP "rdp_credentials.txt"
          @"
RDP CONNECTION DETAILS
==========================================
IP Address : $env:TAILSCALE_IP
Username   : $env:RDP_USER
Password   : $env:RDP_PASSWORD
==========================================
To connect:
1. Open Remote Desktop Connection (mstsc)
2. Computer: $env:TAILSCALE_IP
3. Username: $env:RDP_USER
4. Password: $env:RDP_PASSWORD
==========================================
"@ | Out-File -FilePath $credFile -Encoding UTF8
          echo "CRED_FILE=$credFile" >> $env:GITHUB_ENV

      - name: Upload Credentials
        uses: actions/upload-artifact@v4
        with:
          name: rdp-credentials
          path: ${{ env.CRED_FILE }}
          retention-days: 1

      - name: Maintain Connection
        run: |
          Write-Host "`n[$(Get-Date)] RDP Service is running..."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "`nDownload the 'rdp-credentials' artifact from the job summary page!"
          Write-Host "`nPress Ctrl+C to stop the workflow"
          Write-Host "`nKeeping connection alive...`n"
          
          $counter = 0
          while ($true) {
              $counter++
              Write-Host "[$(Get-Date)] RDP Active - Session active for $counter minutes"
              Start-Sleep -Seconds 60
          }
